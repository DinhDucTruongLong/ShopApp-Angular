<app-header></app-header>
<div class="container">
    <div class="intro-section">
        <h1>Trang Order comnfirm</h1>
    </div>
    <div class="row">
        <div class="col-md-6">
            <h2 class="product-hearder">Thông tin người nhận</h2>
            <form>
                <div class="mb-3">
                    <label for="name" class="form-label">Họ và tên</label>
                    <input type="text" class="form-control" id="name" placeholder="Nhập họ và tên">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Nhập địa chỉ">
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Số điện thoại</label>
                    <input type="text" class="form-control" id="phone" placeholder="Nhập số điện thoại">
                </div>

                <button type="submit" class="btn btn-primary">Đặt hàng</button>
            </form>
        </div>
        <div class="col-md-6">
            <h2 class="product-order">Sản phẩm đã đặt hàng</h2>
            <table>
                <thead>
                    <tr>
                        <th scope="col" class="text-start">Sản phẩm</th>
                        <th scope="col">Số lượng</th>
                        <th scope="col">Đơn giá</th>
                        <th scope="col">Tổng giá</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <div class="product-info">
                                <img src="https://images.pexels.com/photos/5257551/pexels-photo-5257551.jpeg"
                                    class="product-image" alt="Product Image">
                                <span class="product-name">Tên sản phẩm</span>
                            </div>

                        </td>
                        <td>2</td>
                        <td>100.000d</td>
                        <td>200.000d</td>
                    </tr>
                    <tr>
                        <td>
                            <div class="product-info">
                                    <img src="https://images.pexels.com/photos/5257551/pexels-photo-5257551.jpeg"
                                        class="product-image" alt="Product Image">
                                <span class="product-name">Tên sản phẩm</span>
                            </div>

                        </td>
                        <td>1</td>
                        <td>120.000d</td>
                        <td>230.000d</td>
                    </tr>
                </tbody>
            </table>
            <div class="text-start mt-3">
                <h4 class="hearder-text text-end">Tổng giá: 350.000 đ</h4>
            </div>
            <div class="mt-3">
                <h4 class="product-hearder"> Nhập coupon</h4>
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Nhập coupon">
                    <button class="btn btn-gradient" type="button">Áp dụng</button>
                </div>
            </div>
            <div class="text-start mt-3">
                <button class="btn btn-gradient">Đặt hàng</button>
            </div>
    </div>
        </div>
    </div>
<app-footer></app-footer>
