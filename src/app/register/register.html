<div class="container">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="register-form mx-auto">
                <h2 class="register-header">Đăng ký</h2>
                <div class="form-group">
                    <label for="email">Tên đầy đủ</label>
                    <input type="text" class="form-control" id="email" placeholder="Nhập tên đầy đủ của bạn">
                    <div class="divider-nospace"></div>
                </div>
                <div class="mt-3"></div>
                <div class="form-group password-field">
                    <label for="password">Mật khẩu</label>
                    <input type="password" class="form-control" id="registerPassword" placeholder="Nhập mật khẩu">
                    <i class="toggle-password bi bi-eye-slash-fill"></i>
                    <div class="divider-nospace"></div>
                </div>

                <div class="form-group password-field mt-3">
                    <label for="confirmPassword">Xác nhận mật khẩu</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Xác nhận mật khẩu">
                    <i class="toggle-password bi bi-eye-slash-fill"></i>
                    <div class="divider-nospace"></div>
                </div>
                <div class="mt-3"></div>
                <div class="form-group">
                    <label for="full-name"> Họ và tên</label>
                    <input type="text" class="form-control" id="full-name">
                    <div class="divider-nospace"></div>
                </div>
                <div class="form-group">
                    <label for="address"> Địa chỉ</label>
                    <input type="text" class="form-control" id="address">
                    <div class="divider-nospace"></div>
                </div>
                <div class="form-group">
                    <div class="form-check checkbox-text">
                        <span style="display: flex;">
                            <input type="checkbox" class="form-check-input" id="agree">
                            <label class="form-check-label text-start" for="agree">Tôi đồng ý với các điều kiện</label>
                        </span>
                    </div>

                </div>
                <button class="register-button" type="button">Đăng ký</button>
                <div class="divider"></div>
                <p class="text-center">Đã có tài khoản? <span>
                        <a href="#" class="register-link">Đăng nhập ngay</a></span></p>
            </div>
        </div>
    </div>
</div>
<app-footer></app-footer>
